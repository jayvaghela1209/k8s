kind: ReplicaSet
apiVersion: apps/v1
metadata:
  name: nginx-replica
  namespace: nginx-ns
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx-replica
      labels:
         app: nginx
    spec:
      containers:
        - name: nginx-replica
          image: nginx:1.31.4
          ports:
            - containerPort: 80

kind: StatefulSet
apiVersion: apps/v1

metadata:
  name: postgres-statefulset
  namespace: postgres-ns

spec:
  replicas: 4

  serviceName: postgres-service

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres-con

          image: postgres:18.6

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_PASSWORD
              value: root

            - name: POSTGRES_DB
              value: devops

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql

  volumeClaimTemplates:
    - metadata:
        name: postgres-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi
